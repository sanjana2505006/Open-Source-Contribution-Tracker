name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci
      - run: npm run build --workspace=@osct/shared
      - run: npm run typecheck
      - run: npm test
      - run: npm run lint
      # Use `npm run format` / `format:check` locally; not gated in CI yet
      # to avoid a forced repo-wide Prettier rewrite in this change.
